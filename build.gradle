plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def unobfuscated = sc.current.parsed.matches('>=26.1')
apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'

def minecraftVersion = property('minecraft_version')
def fabricApiVersion = property('fabric_api_version')
def modVersion = property('version')
def javaVersion = unobfuscated ? 25 : 21
def javaCompatibility = "JAVA_${javaVersion}"
def javaDependency = ">=${javaVersion}"

version = "${modVersion}+${sc.current.version}"

base {
    archivesName = "keyed-bundles"
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

loom {
    mods {
        "keyed-bundles" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${minecraftVersion}"

    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }

    if (unobfuscated) {
        implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${property('loader_version')}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    }
}

def resourceVersion = version.toString()
def resourceMinecraft = property('minecraft_dependency')

processResources {
    inputs.property "version", resourceVersion
    inputs.property "minecraft", resourceMinecraft
    inputs.property "java", javaDependency
    inputs.property "java_compatibility", javaCompatibility

    filesMatching("fabric.mod.json") {
        expand "version": resourceVersion, "minecraft": resourceMinecraft, "java": javaDependency
    }

    filesMatching("*.mixins.json") {
        expand "java_compatibility": javaCompatibility
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName"}
    }
}
